[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-graph-export"
version = "0.1.0"
description = "Выгрузка графа идеи в читаемый документ, без модели"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["idea-graph-core @ git+https://github.com/senia-glitch/idea-graph-core.git"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."idea_graph.packages"]
export = "idea_graph_export:manifest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idea_graph_export = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
